name: Deploy Supabase migrations

# Runs only on pushes to main that touch supabase/migrations/** (path-filtered so unrelated
# pushes never trigger a deploy attempt). Pushes pending migrations straight to production —
# see CLAUDE.md's "Workflow for schema changes" for the full authoring flow this deploy step
# sits at the end of.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

jobs:
  deploy-migrations:
    name: Push pending migrations to production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Project ref for the linked production Supabase project. This is not a secret — it's
      # the same ref embedded in the public NEXT_PUBLIC_SUPABASE_URL the deployed app already
      # exposes to every client. It corresponds to supabase/config.toml's `project_id`
      # ("top-of-the-flocks", a local-only Docker container naming string, not the hosted
      # project's opaque ref) — confirm via `supabase projects list` if this project is ever
      # recreated under a different ref.
      - name: Link Supabase project
        run: supabase link --project-ref lejgyavxajiwmudrnzwp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push pending migrations to production
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
